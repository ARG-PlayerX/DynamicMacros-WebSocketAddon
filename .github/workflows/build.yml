name: Build Addon

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Addon Repository
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Checkout DynamicMacros Base Mod
        uses: actions/checkout@v4
        with:
          repository: ARG-PlayerX/DynamicMacros
          path: dynamicmacros

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and Publish DynamicMacros API
        run: |
          cd dynamicmacros
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build Addon JAR
        run: |
          cd addon
          chmod +x gradlew
          ./gradlew jar --no-daemon

      - name: Upload Compiled Addon JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-addon-jar
          path: addon/build/libs/*.jar
